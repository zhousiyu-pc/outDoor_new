spring.profiles.default=local
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:18080}
spring.application.name=outdoor-business
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2000
app.agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:19081}
app.agent.token=${AGENT_SERVICE_TOKEN:}
app.agent.timeout-ms=1200
app.candidate.ttl-hours=24
